plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

ext.appNameSuffix = ' Capacitor'
ext.appIdSuffix = '.capacitor'
ext.defaultVersionCode = '10021'
ext.oidcClient = 'capacitor'
apply from: rootProject.file('../android/music-app.gradle')

def shared = rootProject.file('../android/app/src')
def web = rootProject.file('../middleware/frontend')
def packaged = layout.buildDirectory.dir('web-assets')
android {
    sourceSets {
        main {
            manifest.srcFile new File(shared, 'main/AndroidManifest.xml')
            java.srcDir new File(shared, 'main/java')
            kotlin.srcDir new File(shared, 'main/java')
            res.srcDir new File(shared, 'main/res')
            assets.srcDir packaged.get().asFile
        }
        debug.res.srcDir new File(shared, 'debug/res')
        debug.manifest.srcFile "src/bridge/AndroidManifest.xml"
        release.manifest.srcFile "src/bridge/AndroidManifest.xml"
    }
}

dependencies {
    implementation 'com.capacitorjs:core:8.6.2'
    implementation 'androidx.appcompat:appcompat:1.7.1'
}

// The phone always starts from bundled files, including after a cold offline launch.
def bundleWeb = tasks.register('bundleWeb', Exec) {
    workingDir web
    environment 'VITE_APP_NAME', providers.gradleProperty('musicAppName').orElse('Armonia').get() + appNameSuffix
    inputs.property 'appName', environment['VITE_APP_NAME']
    inputs.files(fileTree(web) { exclude 'dist/**', 'node_modules/**' })
    outputs.dir packaged
    commandLine 'npm', 'run', 'build', '--', '--mode', 'capacitor', '--outDir',
        packaged.get().dir('public').asFile.absolutePath, '--emptyOutDir'
}
tasks.named('preBuild') { dependsOn bundleWeb }
