plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

// Armonia for Android: the web interface (middleware/frontend, built in `capacitor` mode) bundled in a
// Capacitor WebView, on top of a Kotlin core (src/main/java) that does playback (Media3), downloads,
// cache, session and Android Auto.

def musicName = providers.gradleProperty('musicAppName').orElse('Armonia').get()
if (!(musicName ==~ /[\p{L}\p{N} ._-]{1,50}/)) throw new GradleException('Invalid musicAppName')

// ── Signing ──────────────────────────────────────────────────────────────────
// One stable key for every build (CI release builds and local Studio builds), so any APK can be
// installed over any other. Android refuses to update an app whose signature changed, which is what
// happens with per-machine debug keys. The build process receives the signing credentials.
def signingStoreFile = System.getenv("MUSIC_KEYSTORE_FILE")
def signingStorePassword = System.getenv("MUSIC_KEYSTORE_PASSWORD")
def signingKeyAlias = System.getenv("MUSIC_KEY_ALIAS")
def signingKeyPassword = System.getenv("MUSIC_KEY_PASSWORD") ?: signingStorePassword
def hasSigningKey = signingStoreFile != null && signingStorePassword != null && signingKeyAlias != null

// Kotlin comes from AGP's built-in Kotlin support (AGP 9+); jvmTarget follows compileOptions.
android {
    namespace = 'com.armonia.app'
    compileSdk = 37

    defaultConfig {
        applicationId = providers.gradleProperty("musicApplicationId").orElse("io.github.davalonie.armonia").get()
        resValue "string", "app_name", musicName
        buildConfigField "String", "APP_NAME", '"' + musicName + '"'
        // OIDC client name the server maps to this app's sign-in return (routes/oidc.py).
        buildConfigField "String", "OIDC_CLIENT", '"android"'
        minSdk = 26
        targetSdk = 36
        // Above every earlier build (Kotlin app 10020, Capacitor test app 10021), so it installs as an update.
        versionCode = Integer.parseInt(providers.gradleProperty("musicVersionCode").orElse('10080').get())
        versionName = "0.8.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    signingConfigs {
        if (hasSigningKey) {
            create("armonia") {
                storeFile = rootProject.file(signingStoreFile)
                storePassword = signingStorePassword
                keyAlias = signingKeyAlias
                keyPassword = signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            if (hasSigningKey) signingConfig = signingConfigs.armonia
        }
        debug {
            applicationIdSuffix ".debug"
            // Same key as release when available, so a Studio install updates a downloaded build and vice versa.
            if (hasSigningKey) signingConfig = signingConfigs.armonia
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
        resValues = true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    sourceSets {
        main.assets.srcDir layout.buildDirectory.dir('web-assets').get().asFile
    }
}

dependencyLocking { lockAllConfigurations() }

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.capacitorjs:core:8.6.2'

    // Media3
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-session:1.11.1"
    implementation "androidx.media3:media3-datasource-okhttp:1.11.1"

    // Networking
    implementation "com.squareup.retrofit2:retrofit:3.0.0"
    implementation "com.squareup.retrofit2:converter-gson:3.0.0"
    implementation "com.squareup.okhttp3:logging-interceptor:5.5.0"

    // Hilt
    implementation "com.google.dagger:hilt-android:2.60.1"
    ksp "com.google.dagger:hilt-compiler:2.60.1"

    // Cover loading for notifications and Android Auto
    implementation "io.coil-kt:coil:2.7.0"

    // Guava for Media3 futures
    implementation "com.google.guava:guava:33.7.2-android"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.11.0"

    // DataStore
    implementation "androidx.datastore:datastore-preferences:1.2.1"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

// The phone always starts from the bundled web, including after a cold offline launch. Gradle builds it
// with npm unless -PmusicPrebuiltWeb points to a folder that already holds it in `public/` (the sandboxed
// tools/android/build_android.py builds it outside the sandbox and passes it in).
def web = rootProject.file('../middleware/frontend')
def packaged = layout.buildDirectory.dir('web-assets')
def prebuilt = providers.gradleProperty('musicPrebuiltWeb')
def bundleWeb = prebuilt.isPresent()
    ? tasks.register('bundleWeb', Copy) {
        from(prebuilt.get())
        into packaged
    }
    : tasks.register('bundleWeb', Exec) {
        workingDir web
        environment 'VITE_APP_NAME', musicName
        inputs.property 'appName', musicName
        inputs.files(fileTree(web) { exclude 'dist/**', 'node_modules/**' })
        outputs.dir packaged
        commandLine 'npm', 'run', 'build', '--', '--mode', 'capacitor', '--outDir',
            packaged.get().dir('public').asFile.absolutePath, '--emptyOutDir'
    }
tasks.named('preBuild') { dependsOn bundleWeb }

// Never accidentally distribute an unsigned release. Debug is a separate app.
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst { if (!hasSigningKey) throw new GradleException('Configure a stable Armonia signing key before release') }
}
