name: Backend and web validation
on:
  push:
    branches: [main]
    paths: ["middleware/**", ".github/workflows/middleware-ci.yml"]
  pull_request:
    paths: ["middleware/**", ".github/workflows/middleware-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.12"}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: "24"}
      # Importing the FastAPI app during pytest collection requires frontend/dist.
      - name: Web checks
        working-directory: middleware/frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Backend checks
        working-directory: middleware
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          pytest -q tests
